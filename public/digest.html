<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Session Story | Beforest</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --forest-green: #344736;
            --rich-red: #86312b;
            --warm-yellow: #ffc083;
            --dark-earth: #342e29;
            --soft-gray: #e7e4df;
            --off-white: #fdfbf7;
        }

        body {
            background-color: var(--soft-gray);
            color: var(--dark-earth);
            font-family: 'ABC Arizona Flare Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .magazine-page {
            max-width: 800px;
            width: 90%;
            background-color: var(--off-white);
            margin: 40px 0;
            padding: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            min-height: 100vh;
        }

        .magazine-header {
            border-bottom: 2px solid var(--dark-earth);
            padding-bottom: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .magazine-header h1 {
            font-family: 'ABC Arizona Flare', serif;
            font-size: 48px;
            margin: 0;
            text-transform: uppercase;
            line-height: 1;
        }

        .magazine-header .issue-meta {
            text-align: right;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .story-hero {
            margin-bottom: 40px;
        }

        .story-hero h2 {
            font-family: 'ABC Arizona Flare', serif;
            font-size: 32px;
            color: var(--rich-red);
            margin-bottom: 10px;
        }

        .story-hero p {
            font-size: 20px;
            line-height: 1.6;
            font-style: italic;
        }

        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        @media (max-width: 600px) {
            .story-grid {
                grid-template-columns: 1fr;
            }
            .magazine-page {
                padding: 30px;
            }
            .magazine-header h1 {
                font-size: 32px;
            }
        }

        .section-title {
            font-family: 'ABC Arizona Flare', serif;
            text-transform: uppercase;
            border-bottom: 1px solid var(--dark-earth);
            padding-bottom: 5px;
            margin-bottom: 20px;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .question-item {
            margin-bottom: 20px;
            padding-left: 20px;
            border-left: 3px solid var(--forest-green);
        }

        .question-text {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .question-meta {
            font-size: 12px;
            color: #666;
        }

        .reaction-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .reaction-stat {
            background-color: var(--soft-gray);
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reaction-stat .emoji {
            font-size: 20px;
        }

        .reaction-stat .count {
            font-weight: bold;
        }

        .magazine-footer {
            margin-top: 60px;
            border-top: 1px solid var(--dark-earth);
            padding-top: 20px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--dark-earth);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }

        .no-data {
            text-align: center;
            padding: 100px 0;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Presentation</a>

    <div class="magazine-page" id="story-content">
        <div class="no-data">Loading your session story...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId');
            
            if (!sessionId) {
                document.getElementById('story-content').innerHTML = '<div class="no-data">No session ID provided.</div>';
                return;
            }

            const data = localStorage.getItem(`digest_${sessionId}`);
            if (!data) {
                document.getElementById('story-content').innerHTML = '<div class="no-data">Story data not found. Please complete a presentation first.</div>';
                return;
            }

            const story = JSON.parse(data);
            renderStory(story);
        });

        function renderStory(story) {
            const container = document.getElementById('story-content');
            
            // Format reactions
            const reactionCounts = {};
            story.userReactions.forEach(r => {
                reactionCounts[r.emoji] = (reactionCounts[r.emoji] || 0) + 1;
            });

            const reactionsHtml = Object.entries(reactionCounts).map(([emoji, count]) => `
                <div class="reaction-stat">
                    <span class="emoji">${emoji}</span>
                    <span class="count">${count}</span>
                </div>
            `).join('') || '<p>No reactions recorded during this session.</p>';

            // Format questions
            const questionsHtml = story.userQuestions.map(q => `
                <div class="question-item">
                    <div class="question-text">"${q.text}"</div>
                    <div class="question-meta">Slide ${q.slideIndex + 1} · ${new Date(q.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                </div>
            `).join('') || '<p>You didn\'t ask any questions this time.</p>';

            const dateStr = new Date(story.timestamp).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

            container.innerHTML = `
                <div class="magazine-header">
                    <h1>The Beforest Post</h1>
                    <div class="issue-meta">
                        Special Edition<br>
                        ${dateStr}
                    </div>
                </div>

                <div class="story-hero">
                    <div class="section-title">Session Summary</div>
                    <h2>${story.participantName}'s Journey</h2>
                    <p>${story.completionSummary || `A personalized retrospective of your experience with ${story.deckTitle}. Across ${story.totalSlides} slides and ${story.questionsAnswered} answered inquiries, you explored the future of collective living.`}</p>
                </div>

                <div class="story-grid">
                    <div class="story-section">
                        <div class="section-title">Your Inquiries</div>
                        ${questionsHtml}
                    </div>
                    <div class="story-section">
                        <div class="section-title">The Vibe</div>
                        <div class="reaction-cluster">
                            ${reactionsHtml}
                        </div>
                        <p style="margin-top: 20px; font-size: 14px; line-height: 1.5;">
                            Reactions help us understand what resonated most with you. 
                            ${reactionCounts['❤️'] ? 'The abundance of hearts shows a strong emotional connection to the vision.' : ''}
                            ${reactionCounts['💡'] ? 'Those lightbulbs suggest moments of clarity and new insight.' : ''}
                        </p>
                    </div>
                </div>

                <div class="story-section">
                    <div class="section-title">Next Steps</div>
                    <p>We've captured your interest. The next step is to move from observer to participant. 
                    Review the deck again at your own pace or reach out to our team to discuss how you can contribute to the Beforest ecosystem.</p>
                </div>

                <div class="magazine-footer">
                    <span>© ${new Date().getFullYear()} BEFOREST COLLECTIVE</span>
                    <span>SESSION ID: ${window.location.search.split('=')[1]}</span>
                    <span>PAGE 01</span>
                </div>
            `;
        }
    </script>
</body>
</html>
