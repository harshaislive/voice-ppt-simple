<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-PPT Player</title>
    <link rel="stylesheet" href="player.css">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen">
            <div class="start-content">
                <h1 id="presentation-title">Loading...</h1>
                <p id="presentation-subtitle"></p>
                <div class="start-form">
                    <input type="text" id="participant-name" placeholder="Your name" autocomplete="name">
                    <button id="start-btn" class="btn-primary">
                        <span>Start Presentation</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Player View -->
        <div id="player-view" class="hidden">
            <!-- Slide Display -->
            <div class="slide-stage">
                <div class="slide-visual" id="slide-visual"></div>
                <div class="slide-content">
                    <h2 id="slide-title"></h2>
                    <p id="slide-subtitle"></p>
                </div>
                <div class="slide-footer">
                    <div class="slide-controls">
                        <button id="play-pause-btn" class="btn-icon" title="Play/Pause">
                            <svg id="play-icon" viewBox="0 0 24 24" width="24" height="24"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>
                            <svg id="pause-icon" viewBox="0 0 24 24" width="24" height="24" class="hidden"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
                        </button>
                        <button id="prev-btn" class="btn-icon" title="Previous slide">
                            <svg viewBox="0 0 24 24" width="24" height="24"><polygon points="19,20 9,12 19,4 19,20" fill="currentColor"/><rect x="5" y="4" width="2" height="16" fill="currentColor"/></svg>
                        </button>
                        <button id="next-btn" class="btn-icon" title="Next slide">
                            <svg viewBox="0 0 24 24" width="24" height="24"><polygon points="5,4 15,12 5,20 5,4" fill="currentColor"/><rect x="17" y="4" width="2" height="16" fill="currentColor"/></svg>
                        </button>
                        <span id="slide-counter">0 / 0</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Narration Subtitle -->
            <div id="subtitle-container" class="subtitle-container">
                <p id="subtitle-text"></p>
            </div>

            <!-- Q&A Sidebar Toggle -->
            <button id="qa-toggle" class="qa-toggle">
                <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9a3 3 0 1 1 3 3c-1 0-2 1-2 2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
                <span>Questions</span>
                <span id="qa-badge" class="badge hidden">0</span>
            </button>

            <!-- Q&A Drawer -->
            <div id="qa-drawer" class="qa-drawer hidden">
                <div class="qa-header">
                    <h3>Questions</h3>
                    <button id="qa-close" class="btn-close">&times;</button>
                </div>
                <div id="qa-list" class="qa-list"></div>
                <div class="qa-input-area">
                    <textarea id="qa-input" placeholder="Ask a question..." rows="2"></textarea>
                    <button id="qa-submit" class="btn-primary btn-sm">Send</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>

    <script src="player.js"></script>
</body>
</html>
