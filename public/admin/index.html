<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice PPT Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Voice PPT Admin</h1>
            <div class="header-actions">
                <input type="password" id="admin-key" placeholder="Admin API Key" style="width: 200px; padding: 8px 12px; font-size: 0.8rem; border: 1px solid var(--border-color);">
            </div>
        </header>
        
        <main>
            <section id="presentations-list">
                <div class="section-header">
                    <h2>Presentations</h2>
                    <button id="btn-create-presentation" class="primary">Create New</button>
                </div>
                <ul id="list-container">
                    <!-- Presentations will be listed here -->
                </ul>
            </section>

            <section id="editor" class="hidden">
                <div class="section-header">
                    <h2 id="editor-title">Edit Presentation</h2>
                    <div style="display: flex; gap: 12px;">
                        <button id="btn-back">Back</button>
                        <button id="btn-save" class="primary">Save Changes</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>ID / Slug</label>
                    <input type="text" id="pres-id" disabled>
                </div>
                <div class="form-group">
                    <label>Project Slug (optional)</label>
                    <input type="text" id="pres-project">
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="pres-title">
                </div>
                <div class="form-group">
                    <label>Start Screen Title</label>
                    <input type="text" id="pres-start-title" placeholder="e.g. Presentations that speak.">
                </div>
                <div class="form-group">
                    <label>Start Screen Subtitle</label>
                    <input type="text" id="pres-start-sub" placeholder="e.g. AI-powered voice narration that brings your slides to life.">
                </div>

                <div class="slides-section">                    <div class="section-header">
                        <h3>Slides</h3>
                        <button id="btn-add-slide">Add Slide</button>
                    </div>
                    <div id="slides-container">
                        <!-- Slides will be rendered here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
